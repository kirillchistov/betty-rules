<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Sailor Moon × Monster High (Face Match)</title>
<style>
  body {
    background: radial-gradient(circle at 50% 0%, #2a1a4a, #0f0820 70%);
    font-family: "Trebuchet MS", sans-serif;
    color: #fff;
    padding: 30px 10px;
    margin: 0;
  }
  h1 {
    text-align: center;
    font-size: 28px;
    text-shadow: 0 0 12px #ff6fbf, 0 0 24px #b06fff;
    margin-bottom: 8px;
  }
  .subtitle { text-align: center; opacity: .75; margin-bottom: 30px; font-style: italic; }
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .card {
    background: linear-gradient(160deg, #ffffff10, #ffffff04);
    border: 1px solid #ffffff20;
    border-radius: 20px;
    padding: 10px;
    text-align: center;
    transition: transform .3s, box-shadow .3s;
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 10px 30px #ff6fbf40;
  }
  .card svg { width: 100%; height: auto; display: block; border-radius: 12px; }
  .card p { margin: 8px 0 4px; font-weight: bold; font-size: 14px; letter-spacing: .5px; }
</style>
</head>
<body>
<h1>Sailor Moon × Monster High</h1>
<p class="subtitle">Сходство с фото: светлые волосы, голубые глаза и веснушки 🌙🖤</p>

<div class="gallery">

<!-- 1. Sailor Moonster -->
<div class="card">
<svg viewBox="0 0 200 240">
  <defs>
    <!-- Базовое лицо (копируется во все SVG) -->
    <g id="face-base">
      <!-- Кожа -->
      <ellipse cx="100" cy="105" rx="38" ry="46" fill="#fae3d9"/>
      <!-- Веснушки -->
      <circle cx="80" cy="115" r="1.2" fill="#d4a373"/>
      <circle cx="85" cy="118" r="1" fill="#d4a373"/>
      <circle cx="75" cy="118" r="1" fill="#d4a373"/>
      <circle cx="120" cy="115" r="1.2" fill="#d4a373"/>
      <circle cx="115" cy="118" r="1" fill="#d4a373"/>
      <circle cx="125" cy="118" r="1" fill="#d4a373"/>
      <circle cx="100" cy="120" r="1" fill="#d4a373"/>
      <!-- Брови -->
      <path d="M70 92 Q82 88 90 93" stroke="#8c6b4a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M130 92 Q118 88 110 93" stroke="#8c6b4a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- Глаза (Голубые, как на фото) -->
      <ellipse cx="82" cy="105" rx="9" ry="11" fill="#fff" stroke="#333" stroke-width="1"/>
      <ellipse cx="118" cy="105" rx="9" ry="11" fill="#fff" stroke="#333" stroke-width="1"/>
      <circle cx="82" cy="105" r="6" fill="#7ba9c4"/>
      <circle cx="118" cy="105" r="6" fill="#7ba9c4"/>
      <circle cx="82" cy="105" r="2.5" fill="#111"/>
      <circle cx="118" cy="105" r="2.5" fill="#111"/>
      <circle cx="84" cy="103" r="1.5" fill="#fff"/>
      <circle cx="120" cy="103" r="1.5" fill="#fff"/>
      <!-- Ресницы -->
      <path d="M73 100 L70 98 M75 105 L71 104 M125 100 L128 98 M125 105 L129 104" stroke="#111" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Нос -->
      <path d="M100 112 Q103 118 98 120" stroke="#d4a373" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <!-- Губы -->
      <path d="M90 132 Q100 128 110 132 Q105 138 100 138 Q95 138 90 132 Z" fill="#e8a4a4"/>
      <path d="M90 132 Q100 135 110 132" stroke="#c77a7a" stroke-width="1" fill="none"/>
    </g>
    <!-- Базовые волосы (прямой пробор, светлые) -->
    <g id="hair-base">
      <path d="M55 110 Q50 40 100 40 Q150 40 145 110 L155 200 Q140 220 130 200 L135 120 Q120 70 100 70 Q80 70 65 120 L70 200 Q60 220 45 200 Z" fill="#d4b07b"/>
      <path d="M60 90 Q100 45 140 90 Q120 60 100 60 Q80 60 60 90 Z" fill="#c39e69"/>
      <!-- Пряди у лица -->
      <path d="M65 120 Q55 150 60 200 L70 200 Q65 150 75 120 Z" fill="#c39e69"/>
      <path d="M135 120 Q145 150 140 200 L130 200 Q135 150 125 120 Z" fill="#c39e69"/>
    </g>
  </defs>

  <circle cx="100" cy="120" r="95" fill="#fbeaff"/>
  <use href="#hair-base"/>
  <use href="#face-base"/>
  
  <!-- Одежда и монстр-детали -->
  <rect x="89" y="148" width="22" height="26" fill="#ead5f2"/>
  <path d="M60 200 Q62 165 100 160 Q138 165 140 200 L148 240 L52 240 Z" fill="#fff"/>
  <path d="M70 168 L100 195 L130 168 L120 185 L100 195 L80 185 Z" fill="#2563eb"/>
  <path d="M72 170 L100 196 L128 170" stroke="#fff" stroke-width="2" fill="none"/>
  <path d="M84 180 Q100 172 116 180 Q100 188 84 180 Z" fill="#dc2626"/>
  <circle cx="100" cy="180" r="4" fill="#fbbf24"/>
  <!-- Тиара -->
  <path d="M68 78 L100 68 L132 78 L122 86 L100 78 L78 86 Z" fill="#fbbf24"/>
  <circle cx="100" cy="76" r="4" fill="#dc2626"/>
  <!-- Клыки -->
  <path d="M95 135 L96 140 L97 135 Z" fill="#fff"/>
  <path d="M103 135 L104 140 L105 135 Z" fill="#fff"/>
</svg>
<p>Sailor Moonster</p>
</div>

<p>Sailor Franken-Stein</p>
</div>
