<!DOCTYPE html>
<html lang="ru" data-theme="lunar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#efe8ff" />
    <title>Мой курс</title>
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16x16.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <script>
      try {
        var raw = localStorage.getItem('svoy-kurs')
        var theme = raw && JSON.parse(raw).state.theme
        if (theme === 'collage' || theme === 'lunar') {
          document.documentElement.dataset.theme = theme
          document.querySelector('meta[name="theme-color"]').setAttribute(
            'content',
            theme === 'collage' ? '#0c0b0f' : '#efe8ff',
          )
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
